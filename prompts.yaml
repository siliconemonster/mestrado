      - id: 1004
        texto: "gerar uma música synthwave"
        resultados: [1004-ETTA-1, 1004-ETTA-2, 1004-ETTA-3, 1004-OV-1, 1004-OV-2, 1004-SN-1, 1004-SN-2, 1004-UD-1, 1004-UD-2]

      - id: 1005
        texto: "gerar uma música lofi hip-hop"
        resultados: [1005-ETTA-1, 1005-ETTA-2, 1005-ETTA-3, 1005-OV-1, 1005-OV-2, 1005-SN-1, 1005-SN-2, 1005-UD-1, 1005-UD-2]

      - id: 1006
        texto: "Crie uma música onde a atmosfera surge da suspensão do tempo (loops longos, êstase
          harmônica, desaceleração, degradação de mídia); o ritmo é secundário ou quase simbólico; a
          harmonia é estática, modal ou ambígua; poucos acordes; o baixo é âncora harmônica, notas
          longas, pouco movimento; a bateria é mínima, reverberada, nostálgica; os ruídos são centrais
          à estética; fita, vinil, wow/flutter; a relação com a memória é crítica e distorcida. Essa
          música paira."
        resultados: [1006-ETTA-1, 1006-ETTA-2, 1006-ETTA-3, 1006-SN-1, 1006-SN-2, 1006-UD-1, 1006-UD-2]

      - id: 1007
        texto: "Crie uma música onde a atmosfera surge da expansão espacial (camadas de pads, chorus, reverb
          moderado, movimento harmônico contínuo); o ritmo sustenta a fluidez, groove leve, constante;
          a harmonia é tonal, progressões simples e emotivas; o baixo tem suporte rítmico suave,
          linhas repetitivas; a bateria é leve e clara, groove contínuo; os ruídos são opcionais e
          sutis; apenas coloração; a relação com a memória é afetiva e idealizada. Essa música
          respira."
        resultados: [1007-ETTA-1, 1007-ETTA-2, 1007-ETTA-3, 1007-SN-1, 1007-SN-2, 1007-UD-1, 1007-UD-2]

      - id: 1008
        texto: "Crie uma música onde a atmosfera é cenográfica, criada por timbre e estética 80s, não por
          ambiência difusa; o ritmo é estrutural, pulso firme e previsível; a harmonia é funcional e
          direcional, influência pop/rock 80s; o baixo é o motor do groove, ostinatos e oitavas; a
          bateria é seca, forte, máquina evidente; os ruídos são evitados, som limpo e brilhante; a
          relação com a memória é de nostalgia estilizada e épica. Essa música avança."
        resultados: [1008-ETTA-1, 1008-ETTA-2, 1008-ETTA-3, 1008-SN-1, 1008-SN-2, 1008-UD-1, 1008-UD-2]

      - id: 1009
        texto: "Crie uma música onde a atmosfera vem da proximidade e imperfeição, sensação de quarto
          pequeno e escuta íntima; o ritmo é humano, swing, microdeslocamentos e repetição hipnótica;
          a harmonia é jazzificada, extensões e voicings abertos; o baixo é complemento do kick,
          presença contida; a bateria é abafada, com swing e imperfeição, os ruídos são constantes,
          ruído como cola emocional; a relação com a memória é cotidiana e íntima. Essa música acolhe."
        resultados: [1009-ETTA-1, 1009-ETTA-2, 1009-ETTA-3, 1009-SN-1, 1009-SN-2, 1009-UD-1, 1009-UD-2]

      - id: 1010
        texto: "80 bpm; ruído de fita; chiado de vinil; reverbs amplos; linha de baixo simples de timbre de
          synth senoide ou triangular + serra filtrada, low pass 200-800HZ. Adicione leve detune e
          leve drive. Poucos picos de transiente. - bateria contendo kick de ataque suave, snare com
          reverb, rimshots ocasionais. ritmo simples - pads formando a harmonia tonal simples com
          synth de duas ondas serra com pequeno detune. o ataque de 1.5 a 3 segundos, reverb de cauda
          longa - melodia: faça um hook simples, de synth."
        resultados: [1010-ETTA-1, 1010-ETTA-2, 1010-ETTA-3, 1010-SN-1, 1010-SN-2, 1010-UD-1, 1010-UD-2]

      - id: 1011
